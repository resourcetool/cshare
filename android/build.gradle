buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2") // Firebase
    }
}

allprojects {
    repositories {
        // Notifee ships its native core as a local Maven repository inside the npm package
        maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
        // Background sync (runs when the phone has internet, even with the app closed) ships its native part the same way
        maven { url "$rootDir/../node_modules/react-native-background-fetch/android/libs" }
    }
}

apply plugin: "com.facebook.react.rootproject"
